$schema: "https://json-schema.org/draft/2020-12/schema"
title: "AI構造化IFDAM"
description: "人間向けIFDAMと対応する機械可読表現。Schema適合、artifact_status、外部参照の記載だけでは正式Baseline成立やCodex引渡し可否を意味しない。"
type: object
additionalProperties: false
required:
  - schema_version
  - ifdam_id
  - name
  - workset_id
  - artifact_status
  - source_artifacts
  - human_representation
  - interfaces
  - events
  - functions
  - data_stores
  - interactions
properties:
  schema_version:
    type: string
    const: "2.0"
  ifdam_id:
    type: string
    pattern: "^IFDAM-[A-Z0-9-]+$"
  name:
    type: string
    minLength: 1
  workset_id:
    type: string
    pattern: "^WS-[A-Z0-9-]+$"
  artifact_status:
    description: "AI構造化IFDAM自身の編集・確認状態。approvedでも正式Baseline成立やCodex引渡し可否を意味しない。"
    type: string
    enum: [draft, review, approved, change-requested, obsolete]
  source_artifacts:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [artifact_id, artifact_type, repository_path]
      properties:
        artifact_id:
          type: string
        artifact_type:
          type: string
          enum: [planning, overview, requirement-list, action-scenario, conceptual-data-model, ui, function, data, constraint, non-functional, other]
        repository_path:
          type: string
        source_commit:
          type: string
        source_location:
          type: string
        review_snapshot_path:
          type: string
  human_representation:
    type: object
    additionalProperties: false
    required: [mermaid_source_path, rendered_diagram_paths, mapping_manifest_path]
    properties:
      mermaid_source_path:
        type: string
      rendered_diagram_paths:
        type: array
        minItems: 1
        items:
          type: string
      review_document_paths:
        type: array
        items:
          type: string
      approved_snapshot_paths:
        type: array
        items:
          type: string
      mapping_manifest_path:
        type: string
        minLength: 1
  candidate_reference:
    description: "このIFDAMを含むBaseline Candidate Packageへの参照。候補Packageは正式Baselineではない。"
    type: object
    additionalProperties: false
    properties:
      candidate_baseline_id:
        type: string
      candidate_manifest_path:
        type: string
      candidate_head_commit:
        type: string
      included_interaction_ids:
        type: array
        items:
          type: string
          pattern: "^INT-[A-Z0-9-]+$"
  external_baseline_reference:
    description: "正式Baseline成立後に外部記録を参照するための任意情報。ここに値があるだけでは成立の権威にならず、Establishment Recordを確認する。"
    type: object
    additionalProperties: false
    properties:
      establishment_id:
        type: string
      establishment_record_path:
        type: string
      baseline_id:
        type: string
      requirement_commit:
        type: string
      release_repository:
        type: string
      release_branch:
        type: string
      handoff_eligibility_reference:
        type: string
  interfaces:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/interface"
  events:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/event"
  functions:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/function"
  data_stores:
    type: array
    items:
      $ref: "#/$defs/dataStore"
  interactions:
    type: array
    minItems: 1
    items:
      $ref: "#/$defs/interaction"
  related_artifact_ids:
    type: object
    additionalProperties: false
    properties:
      development_request_ids:
        type: array
        items:
          type: string
      action_scenario_ids:
        type: array
        items:
          type: string
      conceptual_data_model_ids:
        type: array
        items:
          type: string
      ui_artifact_ids:
        type: array
        items:
          type: string
      function_artifact_ids:
        type: array
        items:
          type: string
      data_artifact_ids:
        type: array
        items:
          type: string
      constraint_artifact_ids:
        type: array
        items:
          type: string
  unknowns:
    type: array
    items:
      $ref: "#/$defs/unknown"
$defs:
  interface:
    type: object
    additionalProperties: false
    required: [interface_id, name, interface_type, business_purpose]
    properties:
      interface_id:
        type: string
        pattern: "^(UI|IF)-[A-Z0-9-]+$"
      name:
        type: string
      interface_type:
        type: string
        enum: [screen, external-api, file, notification, sensor, batch, other]
      business_purpose:
        type: string
      displayed_information:
        type: array
        items:
          type: string
      input_information:
        type: array
        items:
          type: string
      available_actions:
        type: array
        items:
          type: string
      constraints:
        type: array
        items:
          type: string
      source_locations:
        type: array
        items:
          type: string
  event:
    type: object
    additionalProperties: false
    required: [event_id, name, source_interface_id, business_trigger]
    properties:
      event_id:
        type: string
        pattern: "^EVT-[A-Z0-9-]+$"
      name:
        type: string
      source_interface_id:
        type: string
        pattern: "^(UI|IF)-[A-Z0-9-]+$"
      business_trigger:
        type: string
      input_information:
        type: array
        items:
          type: string
      occurrence_conditions:
        type: array
        items:
          type: string
      source_locations:
        type: array
        items:
          type: string
  function:
    type: object
    additionalProperties: false
    required: [function_id, name, business_purpose, normal_result]
    properties:
      function_id:
        type: string
        pattern: "^FN-[A-Z0-9-]+$"
      name:
        type: string
      business_purpose:
        type: string
      inputs:
        type: array
        items:
          type: string
      outputs:
        type: array
        items:
          type: string
      business_rules:
        type: array
        items:
          type: string
      normal_result:
        type: array
        minItems: 1
        items:
          type: string
      alternative_results:
        type: array
        items:
          type: string
      exception_results:
        type: array
        items:
          type: string
      source_locations:
        type: array
        items:
          type: string
  dataStore:
    type: object
    additionalProperties: false
    required: [data_store_id, name, business_meaning]
    properties:
      data_store_id:
        type: string
        pattern: "^DS-[A-Z0-9-]+$"
      name:
        type: string
      business_meaning:
        type: string
      conceptual_model_reference:
        type: string
      source_locations:
        type: array
        items:
          type: string
  interaction:
    type: object
    additionalProperties: false
    required: [interaction_id, flow_type, start_interface_id, event_id, function_id, data_store_operations, end_interface_id, expected_results]
    properties:
      interaction_id:
        type: string
        pattern: "^INT-[A-Z0-9-]+$"
      name:
        type: string
      flow_type:
        type: string
        enum: [normal, alternative, exception]
      start_interface_id:
        type: string
        pattern: "^(UI|IF)-[A-Z0-9-]+$"
      event_id:
        type: string
        pattern: "^EVT-[A-Z0-9-]+$"
      function_id:
        type: string
        pattern: "^FN-[A-Z0-9-]+$"
      data_store_operations:
        type: array
        items:
          type: object
          additionalProperties: false
          required: [data_store_id, operations]
          properties:
            data_store_id:
              type: string
              pattern: "^DS-[A-Z0-9-]+$"
            operations:
              type: array
              minItems: 1
              uniqueItems: true
              items:
                type: string
                enum: [C, R, U, D]
      end_interface_id:
        type: string
        pattern: "^(UI|IF)-[A-Z0-9-]+$"
      preconditions:
        type: array
        items:
          type: string
      expected_results:
        type: array
        minItems: 1
        items:
          type: string
      unknown_ids:
        type: array
        items:
          type: string
      source_locations:
        type: array
        items:
          type: string
  unknown:
    type: object
    additionalProperties: false
    required: [unknown_id, description, blocking_scope, affected_ids, blocking]
    properties:
      unknown_id:
        type: string
      description:
        type: string
      blocking_scope:
        type: string
        enum: [none, interaction, ifdam, workset]
      affected_ids:
        type: array
        items:
          type: string
      blocking:
        type: boolean
      decision_owner:
        type: string
      status:
        type: string
        enum: [open, resolved, deferred-by-human-decision]
      decision_record:
        type: string
      decision_issue:
        type: string

