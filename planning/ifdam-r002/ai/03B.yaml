- function_id: FN-KARATE-04
  name: 出席を記録する
  business_purpose: 出席を記録する
  inputs: *id001
  outputs:
  - 会員名・道場名・出席日
  - 保存済み／既に記録済み
  - 不明QR・権限・保存のエラー
  - 保存結果不明
