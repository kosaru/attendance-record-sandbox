  - 会員名・道場名・出席日|保存済み／既に記録済み|不明QR・権限・保存のエラー|保存結果不明
  business_rules:
  - サーバー受付時の日本時間で日付を決める
  - 同一会員・日・道場の重複は増やさない
  - 同じ日の別道場は別の出席
  - 取消後の再登録はU01
  - 道場名の過去表示はU02
  - 保存と応答の両方を確認できて初めて成功表示
  - 結果不明時は保存済みの可能性がある
  - 新しい過去出席は追加しない
  source_locations:
  - planning/ifdam-r002/index.html#fn-04
