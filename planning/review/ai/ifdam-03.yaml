functions:
- function_id: FN-KARATE-04
  name: 出席を記録する
  business_purpose: 出席を記録する
  inputs: *id001
  outputs:
  - 確定したスタンプを表示
  business_rules:
  - サーバー受付時の日本時間の日付
  - 同一会員・同一道場・同日を重複計上しない
  - 別道場は同日でも追加可
  - 保存確定前に成功表示しない
  - 現地確認なし・固定QR
  - オンラインのみ、過去日の新規追加なし
  normal_result:
  - 確定したスタンプを表示
  exception_results:
  - 不明QR・権限なしは記録しない
  - 保存失敗と結果不明を区別
  source_locations:
  - planning/review/index.html#functions
- function_id: FN-KARATE-06
  name: 保存結果を確認する
  business_purpose: 保存結果を確認する
  inputs: *id002
  outputs:
  - 元の出席結果を返す
  business_rules:
  - 受付済みなら元の出席日を維持
  - 日付またぎで翌日の新規出席に自動置換しない
  - 確認不能は結果不明を維持
  normal_result:
  - 元の出席結果を返す
  exception_results:
  - 不明なら接続回復後に再確認
  source_locations:
  - planning/review/index.html#functions
