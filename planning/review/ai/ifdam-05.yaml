functions:
- function_id: FN-KARATE-08
  name: 試作参加者と道場を準備する
  business_purpose: 試作参加者と道場を準備する
  inputs: *id005
  outputs:
  - 参加許可と固定QRを用意
  business_rules:
  - 依頼者が配布、道場責任者が掲示
  - 一般利用者が道場を追加しない
  - 準備画面を一般公開しない
  normal_result:
  - 参加許可と固定QRを用意
  exception_results:
  - 重複するQR対応は登録しない
  source_locations:
  - planning/review/index.html#functions
- function_id: FN-KARATE-09
  name: 誤登録を訂正・取消する
  business_purpose: 誤登録を訂正・取消する
  inputs: *id001
  outputs:
  - 訂正結果と履歴を保存
  business_rules:
  - 変更前後・理由・担当・日時を残す
  - 未登録の過去出席を追加しない
  - 訂正先が重複なら中止して確認
  - 取消分はスタンプと集計から除外
  - 名前修正も依頼者への連絡で扱う
  normal_result:
  - 訂正結果と履歴を保存
  exception_results:
  - 権限なし・対象なし・履歴を含め保存できない場合は変更完了にしない
  source_locations:
  - planning/review/index.html#functions
- function_id: FN-KARATE-10
  name: 日次バックアップを作る
  business_purpose: 日次バックアップを作る
  inputs: *id002
  outputs:
  - 非公開Driveに復元用コピーを保存
  business_rules:
  - 毎日1回・直近7日分
  - 整合したコピーと転送完了を確認
  - 失敗時は直前正常コピーを残し古いコピーの削除を進めない
  - ログインの一時情報・パスワードは含めない
  normal_result:
  - 非公開Driveに復元用コピーを保存
  exception_results:
  - 失敗を運用結果に残して依頼者が確認
  source_locations:
  - planning/review/index.html#functions
- function_id: FN-KARATE-11
  name: バックアップから復旧する
  business_purpose: バックアップから復旧する
  inputs: *id003
  outputs:
  - 復元した記録を確認
  business_rules:
  - 最後の正常バックアップ以降は失われ得る
  - 件数・年間回数・アカウント対応を別の試験環境で確認
  - 復旧時間は保証しない
  normal_result:
  - 復元した記録を確認
  exception_results:
  - 破損・不整合なら復旧完了にしない
  source_locations:
  - planning/review/index.html#functions
- function_id: FN-KARATE-12
  name: 試作終了データを削除する
  business_purpose: 試作終了データを削除する
  inputs: *id004
  outputs:
  - 終了後30日以内に試作データ一式を削除
  business_rules:
  - 通常保存・Driveコピー・訂正履歴・アカウント識別情報を対象
  - 本番移行しない
  - 復元試験用コピーも対象
  normal_result:
  - 終了後30日以内に試作データ一式を削除
  exception_results:
  - 削除失敗は未完了として追跡
  source_locations:
  - planning/review/index.html#functions
